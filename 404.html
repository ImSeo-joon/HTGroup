<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071320">
  <title>Page not found — HighTableGroup</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      color: #f2efe7;
      background:
        radial-gradient(circle at 72% 18%, rgba(178,139,85,.18), transparent 30%),
        #071320;
      font-family: Georgia, "Times New Roman", "Noto Serif SC", serif;
    }
    main { width: min(680px, 100%); border-top: 1px solid rgba(224,201,159,.35); border-bottom: 1px solid rgba(224,201,159,.35); padding: 54px 0; }
    .mark {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(224,201,159,.34);
      border-radius: 13px;
      color: #e0c99f;
      background: #07101b;
      font: 18px/1 Georgia, "Times New Roman", serif;
      letter-spacing: -.04em;
    }
    p:first-of-type { margin: 34px 0 14px; color: #e0c99f; font: 11px/1.4 "Courier New", monospace; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0 0 22px; font-size: clamp(3.5rem, 11vw, 7rem); font-weight: 400; line-height: .85; letter-spacing: -.04em; }
    h1 em { color: #e0c99f; font-weight: 400; }
    .body { max-width: 480px; color: rgba(242,239,231,.65); font: 16px/1.7 "Segoe UI", "Microsoft YaHei", sans-serif; }
    a { display: inline-block; margin-top: 22px; padding-bottom: 5px; border-bottom: 1px solid #e0c99f; color: #e0c99f; font: 11px/1.4 "Courier New", monospace; letter-spacing: .14em; text-decoration: none; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">HTG</span>
    <p>404 · Outside the house</p>
    <h1>This room does <em>not exist.</em></h1>
    <p class="body">The page may have moved, or the address may be incomplete. Return to the table and choose one of the four rooms.</p>
    <a href="./">Return to HighTableGroup</a>
  </main>
</body>
</html>
